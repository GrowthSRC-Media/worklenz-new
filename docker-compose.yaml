services:
  # Redis Cache
  redis:
    image: redis:7.4-alpine
    container_name: worklenz-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-worklenz_redis_pass}
    volumes:
      - redis_data:/data
    networks:
      - worklenz-backend
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a ${REDIS_PASSWORD:-worklenz_redis_pass} ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: worklenz-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      MINIO_BROWSER: ${MINIO_BROWSER:-on}
    volumes:
      - minio_data:/data
    networks:
      - worklenz-backend
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.worklenz-minio-web.rule=Host(`${DOMAIN}`) && PathPrefix(`/minio`)
      - traefik.http.routers.worklenz-minio-web.entrypoints=web
      - traefik.http.routers.worklenz-minio-web.middlewares=redirect-to-https@file
      - traefik.http.routers.worklenz-minio-websecure.rule=Host(`${DOMAIN}`) && PathPrefix(`/minio`)
      - traefik.http.routers.worklenz-minio-websecure.entrypoints=websecure
      - traefik.http.routers.worklenz-minio-websecure.tls.certresolver=letsencrypt
      - traefik.http.middlewares.minio-stripprefix.stripprefix.prefixes=/minio
      - traefik.http.routers.worklenz-minio-web.middlewares=redirect-to-https@file
      - traefik.http.routers.worklenz-minio-websecure.middlewares=minio-stripprefix
      - traefik.http.services.worklenz-minio.loadbalancer.server.port=9000
      - traefik.http.routers.worklenz-minio-web.service=worklenz-minio
      - traefik.http.routers.worklenz-minio-websecure.service=worklenz-minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # MinIO Client - Create initial bucket
  minio-init:
    image: minio/mc:latest
    container_name: worklenz-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      MINIO_BUCKET: ${AWS_BUCKET:-worklenz-bucket}
    networks:
      - worklenz-backend
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to be ready...';
      sleep 5;
      /usr/bin/mc alias set worklenz http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb worklenz/$${MINIO_BUCKET} --ignore-existing;
      /usr/bin/mc anonymous set download worklenz/$${MINIO_BUCKET};
      echo 'MinIO bucket created and configured successfully';
      exit 0;
      "

  # Backend API
  backend:
    build:
      context: ./worklenz-backend
      dockerfile: Dockerfile
    container_name: wl-backend-v2
    restart: unless-stopped
    environment:
      # Server Configuration
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      SESSION_NAME: ${SESSION_NAME:-worklenz.sid}

      # Database Configuration (External)
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-worklenz_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MAX_CLIENTS: ${DB_MAX_CLIENTS:-50}
      USE_PG_NATIVE: ${USE_PG_NATIVE:-false}

      # CORS Configuration
      SERVER_CORS: ${SERVER_CORS:-*}
      SOCKET_IO_CORS: ${SOCKET_IO_CORS}
      FRONTEND_URL: ${FRONTEND_URL}

      # Storage Configuration
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}

      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-worklenz_redis_pass}
      REDIS_DB: ${REDIS_DB:-0}

      # S3/MinIO Configuration (Express mode default)
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_BUCKET: ${AWS_BUCKET:-worklenz-bucket}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      S3_URL: ${S3_URL:-http://minio:9000}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}

      # Azure Blob Storage Configuration (Advanced mode)
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY:-}
      AZURE_STORAGE_URL: ${AZURE_STORAGE_URL:-}

      # Google OAuth (Optional)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}

      # Email Configuration (Optional)
      ENABLE_EMAIL_CRONJOBS: ${ENABLE_EMAIL_CRONJOBS:-false}
      CONTACT_US_EMAIL: ${CONTACT_US_EMAIL:-}

      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}

      # Google Recaptcha (Optional)
      GOOGLE_CAPTCHA_SECRET_KEY: ${GOOGLE_CAPTCHA_SECRET_KEY:-}
      GOOGLE_CAPTCHA_PASS_SCORE: ${GOOGLE_CAPTCHA_PASS_SCORE:-0.8}

      # SMTP Configuration
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}

      # Timezone
      TZ: ${TZ:-UTC}

    volumes:
      - backend_logs:/app/logs
    networks:
      - worklenz-backend
      - worklenz-frontend
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.worklenz-backend-web.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/socket.io`) || PathPrefix(`/socket`) || PathPrefix(`/public`) || PathPrefix(`/secure`) || PathPrefix(`/csrf-token`) || PathPrefix(`/webhook`))
      - traefik.http.routers.worklenz-backend-web.entrypoints=web
      - traefik.http.routers.worklenz-backend-web.middlewares=redirect-to-https@file
      - traefik.http.routers.worklenz-backend-websecure.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/socket.io`) || PathPrefix(`/socket`) || PathPrefix(`/public`) || PathPrefix(`/secure`) || PathPrefix(`/csrf-token`) || PathPrefix(`/webhook`))
      - traefik.http.routers.worklenz-backend-websecure.entrypoints=websecure
      - traefik.http.routers.worklenz-backend-websecure.tls.certresolver=letsencrypt
      - traefik.http.services.worklenz-backend.loadbalancer.server.port=3000
      - traefik.http.routers.worklenz-backend-web.service=worklenz-backend
      - traefik.http.routers.worklenz-backend-websecure.service=worklenz-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/public/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  # Frontend Application
  frontend:
    build:
      context: ./worklenz-frontend
      dockerfile: Dockerfile
    container_name: worklenz-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Runtime environment variables (injected at startup)
      VITE_API_URL: ${VITE_API_URL}
      VITE_SOCKET_URL: ${VITE_SOCKET_URL}
      VITE_APP_TITLE: ${VITE_APP_TITLE:-Worklenz}
      VITE_APP_ENV: production
      VITE_ENABLE_RECAPTCHA: ${VITE_ENABLE_RECAPTCHA:-false}
      VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
      VITE_ENABLE_GOOGLE_LOGIN: ${VITE_ENABLE_GOOGLE_LOGIN:-false}
      VITE_ENABLE_SURVEY_MODAL: ${VITE_ENABLE_SURVEY_MODAL:-false}
    networks:
      - worklenz-frontend
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.worklenz-frontend-web.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.worklenz-frontend-web.entrypoints=web
      - traefik.http.routers.worklenz-frontend-web.middlewares=redirect-to-https@file
      - traefik.http.routers.worklenz-frontend-web.priority=1
      - traefik.http.routers.worklenz-frontend-websecure.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.worklenz-frontend-websecure.entrypoints=websecure
      - traefik.http.routers.worklenz-frontend-websecure.tls.certresolver=letsencrypt
      - traefik.http.routers.worklenz-frontend-websecure.priority=1
      - traefik.http.services.worklenz-frontend.loadbalancer.server.port=5000
      - traefik.http.routers.worklenz-frontend-web.service=worklenz-frontend
      - traefik.http.routers.worklenz-frontend-websecure.service=worklenz-frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true


networks:
  worklenz-backend:
    driver: bridge
  worklenz-frontend:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  redis_data:
    driver: local
  minio_data:
    driver: local
  backend_logs:
    driver: local
